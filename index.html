<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HoloDesk — Image to Video</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#08120c;color:#fff;min-height:100vh}main{max-width:760px;margin:auto;padding:28px 16px}.card{background:#102018;border:1px solid #31503b;border-radius:22px;padding:24px}h1{margin:0 0 8px}p{color:#b9c8be}.drop{display:block;border:2px dashed #567260;border-radius:16px;padding:28px;text-align:center;margin:20px 0;cursor:pointer}input{display:none}textarea{width:100%;min-height:120px;padding:14px;border-radius:12px;background:#08130d;color:white;border:1px solid #45604d;font-size:16px}button{width:100%;padding:15px;margin-top:15px;border:0;border-radius:12px;background:#b9e8c5;font-weight:700;font-size:17px}button:disabled{opacity:.5}#preview{display:none;max-width:100%;max-height:350px;margin:15px auto;border-radius:12px}#status{text-align:center;margin-top:15px;color:#b9c8be}video{display:none;width:100%;margin-top:18px;border-radius:12px}</style></head><body><main><div class="card"><h1>HoloDesk Image to Video</h1><p>Создайте видео из фотографии с помощью AI.</p><label class="drop" for="file">📷 Нажмите, чтобы выбрать фотографию<br><small>JPG, PNG, WEBP</small></label><input id="file" type="file" accept="image/jpeg,image/png,image/webp"><img id="preview"><textarea id="prompt" placeholder="Например: человек медленно поворачивает голову, волосы слегка двигаются от ветра..."></textarea><button id="go">🎬 Создать видео</button><div id="status"></div><video id="video" controls></video></div></main><script>const f=document.getElementById('file'),p=document.getElementById('preview'),b=document.getElementById('go'),s=document.getElementById('status'),v=document.getElementById('video');f.onchange=()=>{if(f.files[0]){p.src=URL.createObjectURL(f.files[0]);p.style.display='block'}};b.onclick=async()=>{if(!f.files[0])return s.textContent='Сначала выберите фотографию.';const q=document.getElementById('prompt').value.trim();if(!q)return s.textContent='Опишите движение.';const d=new FormData();d.append('image',f.files[0]);d.append('prompt',q);b.disabled=true;s.textContent='Создаю видео…';try{const r=await fetch('/api/generate',{method:'POST',body:d});const x=await r.json();if(!r.ok)throw Error(x.error||'Ошибка');v.src=x.videoUrl;v.style.display='block';s.textContent='Готово!'}catch(e){s.textContent='Ошибка: '+e.message}b.disabled=false}</script></body></html>
