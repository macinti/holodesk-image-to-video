<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a20">
  <title>HoloDesk — Image to Video</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(ellipse at 20% 0%,#214c4a 0,#101a20 52%,#0b1117 100%);color:#f4f7f6;min-height:100vh;padding:28px 16px}
    main{max-width:720px;margin:0 auto}
    .brand{display:flex;align-items:center;gap:12px;margin:8px 0 28px}
    .logo{width:42px;height:42px;border:1px solid #75d9c3;border-radius:14px;display:grid;place-items:center;color:#83e3cd;font-size:22px}
    h1{font-size:25px;margin:0;letter-spacing:.2px}.sub{color:#a8bcb8;font-size:13px;margin-top:4px}
    .panel{background:#152329eF;border:1px solid #31504f;border-radius:22px;padding:22px;box-shadow:0 18px 60px #0005}
    h2{font-size:18px;margin:0 0 18px}
    label{display:block;font-size:14px;color:#c8d8d4;margin:18px 0 8px}
    input[type=file],textarea,select{width:100%;background:#0d171c;color:#f4f7f6;border:1px solid #36504f;border-radius:12px;padding:13px;font:inherit}
    textarea{min-height:118px;resize:vertical;line-height:1.5}
    input[type=file]{padding:12px}
    .hint{font-size:12px;color:#8fa6a1;margin-top:7px}
    button{width:100%;border:0;border-radius:13px;padding:15px 18px;margin-top:22px;background:linear-gradient(100deg,#69d6bd,#a2e9d8);color:#10201e;font-size:16px;font-weight:750}
    button:disabled{opacity:.55}
    #status{min-height:24px;margin-top:16px;color:#b9dcd3;font-size:14px;white-space:pre-wrap}
    #preview{display:none;margin-top:20px;width:100%;border-radius:15px;background:#000}
    .footer{color:#839994;font-size:12px;text-align:center;margin:18px 0}
  </style>
</head>
<body>
<main>
  <div class="brand"><div class="logo">✧</div><div><h1>HoloDesk</h1><div class="sub">Image to Video · создание видео из фотографии</div></div></div>
  <section class="panel">
    <h2>Создать видео</h2>
    <label for="image">1. Выберите фотографию</label>
    <input id="image" type="file" accept="image/jpeg,image/png,image/webp">
    <div class="hint">JPG, PNG или WEBP · до 12 МБ</div>

    <label for="prompt">2. Опишите движение</label>
    <textarea id="prompt" maxlength="1500" placeholder="Например: Человек естественно поворачивает голову, слегка улыбается, камера плавно приближается. Сохранить лицо и внешность без изменений."></textarea>

    <label for="movement">3. Интенсивность движения</label>
    <select id="movement">
      <option value="small">Небольшая</option>
      <option value="medium" selected>Средняя</option>
      <option value="large">Выраженная</option>
      <option value="auto">Автоматически</option>
    </select>

    <button id="generate">Создать видео</button>
    <div id="status" role="status"></div>
    <video id="preview" controls playsinline></video>
  </section>
  <div class="footer">Ваш ключ генерации хранится на сервере и не показывается в браузере.</div>
</main>
<script>
const imageInput = document.getElementById("image");
const promptInput = document.getElementById("prompt");
const movementInput = document.getElementById("movement");
const button = document.getElementById("generate");
const statusBox = document.getElementById("status");
const preview = document.getElementById("preview");

button.addEventListener("click", async () => {
  if (!imageInput.files[0]) { statusBox.textContent = "Выберите фотографию."; return; }
  if (!promptInput.value.trim()) { statusBox.textContent = "Напишите, что должно происходить в видео."; return; }
  const form = new FormData();
  form.append("image", imageInput.files[0]);
  form.append("prompt", promptInput.value.trim());
  form.append("movement", movementInput.value);
  button.disabled = true;
  preview.style.display = "none";
  statusBox.textContent = "Загружаю фотографию и создаю видео. Это может занять несколько минут…";
  try {
    const response = await fetch("/api/generate", { method: "POST", body: form });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || "Ошибка генерации.");
    preview.src = result.videoUrl;
    preview.style.display = "block";
    statusBox.textContent = "Готово! Видео создано.";
  } catch (error) {
    statusBox.textContent = error.message || "Не удалось создать видео.";
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
